<style>@font-face{font-family:Mukta;font-style:normal;font-weight:400;font-display:swap;src:url(fonts/mukta-latin-400-normal.woff2) format("woff2")}@font-face{font-family:Mukta;font-style:normal;font-weight:500;font-display:swap;src:url(fonts/mukta-latin-500-normal.woff2) format("woff2")}@font-face{font-family:Mukta;font-style:normal;font-weight:700;font-display:swap;src:url(fonts/mukta-latin-700-normal.woff2) format("woff2")}@font-face{font-family:Mukta;font-style:normal;font-weight:800;font-display:swap;src:url(fonts/mukta-latin-800-normal.woff2) format("woff2")}</style>
<style>
/* VOICE everyday travel companion, kept for years: calm, rich, exact
   IDEA an illustrated pocket atlas of India with a passport inside: map, postcards, trails, stamps
   PICTURE the live map fills the screen; every place gets a drawn postcard; visits earn ink stamps
   COLOUR monsoon-sea blue, paper land, marigold for unlocked states, India pink for your own picks
   TYPE Mukta 800 for names and numbers, Mukta for text
   LAYOUT phone: full-screen map, draggable bottom sheet; laptop: 440px panel left, map right */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#12161d);--ink:light-dark(#16181d,#eef1f5);--soft:light-dark(#545b6a,#aeb5c4);--faint:light-dark(#646c7c,#949db0);
--line:light-dark(#e6e9ee,#252b36);--card:light-dark(#f5f6f8,#1a1f29);--card2:light-dark(#eef0f4,#222835);
--sea:light-dark(#a7d2e6,#0b2231);--shore:light-dark(#cbe7f3,#123247);--grat:light-dark(#93c3da,#123044);
--land:light-dark(#fffaf0,#1c2330);--edge:light-dark(#b5c1cb,#364253);
--done:light-dark(#ffdc8f,#2f2b22);--cur:light-dark(#ffc94f,#3b3526);--curedge:light-dark(#d79a12,#d4a43a);
--gold:#f2a007;--pink:#e5246b;--pinkink:light-dark(#c4145a,#ff5c93);--pinksoft:light-dark(#fde4ee,#3a1426);
--shadow:0 10px 30px rgba(10,20,40,.18);--other:light-dark(#f4efe4,#191f2a);--tabh:0px}
@media(max-width:899px) and (orientation:portrait),(max-width:899px) and (min-height:541px){:root{--tabh:calc(60px + env(safe-area-inset-bottom,0px))}}
:root[data-theme=light]{color-scheme:light}.seg3{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--other);border:1px solid var(--line);margin-bottom:8px}.seg3 button{flex:1;height:42px;border:0;border-radius:10px;background:none;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink)}.seg3 button svg{width:18px;height:18px}.seg3 button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.15);color:var(--pinkink)}.slab{font-size:13px;font-weight:700;opacity:.7;margin:4px 2px 6px}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Mukta,system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
@media(min-width:900px),(orientation:landscape) and (max-height:540px){#app{grid-template-columns:min(440px,46vw) minmax(0,1fr)}}
#mapwrap{position:relative;background:var(--sea);overflow:hidden;touch-action:none;grid-row:1;grid-column:1/-1}
@media(min-width:900px),(orientation:landscape) and (max-height:540px){#mapwrap{grid-column:2}}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
#mapwrap:has(#map:focus-visible){box-shadow:inset 0 0 0 3px var(--pink)}
.sea{fill:var(--sea)}.grat{fill:none;stroke:var(--grat);stroke-width:.6;vector-effect:non-scaling-stroke}
.shore{fill:none;stroke:var(--shore);stroke-width:9;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.st{fill:var(--land);stroke:var(--edge);stroke-width:.7;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .25s}
.st.done{fill:var(--done)}.st.cur{fill:var(--cur);stroke:var(--curedge);stroke-width:1.2}
.slbl{font:500 12px Mukta,sans-serif;fill:var(--faint);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--land);stroke-width:3px}
.slbl.d{fill:var(--ink);font-weight:700}
.pin{cursor:pointer;outline:none}.pin .hit{fill:transparent;stroke:none}.pin:focus-visible circle.dot{stroke:var(--pink);stroke-width:3}.pin circle.dot{stroke:#fff;stroke-width:1.6}.pin.dim{opacity:.28}
.pin.sel circle.dot{stroke:var(--ink);stroke-width:2.4}.pin .ol{fill:rgba(10,15,25,.32)}.pin.hide{display:none}
#map.instate .st:not(.cur){fill:var(--other)}#map.instate .st:not(.cur):hover{fill:var(--done)}
.ring{fill:none;stroke:var(--pink);stroke-width:2;animation:pulse 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{from{transform:scale(.6);opacity:1}to{transform:scale(1.8);opacity:0}}
.plbl{font:700 12px Mukta,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.route{fill:none;stroke:var(--pink);stroke-width:3;stroke-dasharray:7 6;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.9}
.rnum{font:800 11px Mukta,sans-serif;fill:#fff;text-anchor:middle;pointer-events:none}
.mark{width:28px;height:28px;flex:none}
/* sheet */
#sheet{background:var(--bg);display:flex;flex-direction:column;z-index:5;grid-row:1;grid-column:1}
@media(max-width:899px) and (orientation:portrait),(max-width:899px) and (min-height:541px){#sheet{position:fixed;left:0;right:0;bottom:var(--tabh);height:var(--snap,136px);max-height:calc(100% - 8px - var(--tabh) - env(safe-area-inset-top,0px));border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(10,20,40,.22);transition:height .3s cubic-bezier(.2,.8,.2,1)}
#sheet.drag{transition:none}}
@media(min-width:900px),(orientation:landscape) and (max-height:540px){#sheet{border-right:1px solid var(--line);height:100%}.grab{display:none}}
.grab{height:28px;width:100%;border:0;background:none;padding:0;display:grid;place-items:center;touch-action:none;cursor:grab;flex:none}
.grab i{width:42px;height:5px;border-radius:3px;background:var(--line);transition:width .15s,background .15s}#sheet.drag .grab i{width:56px;background:var(--faint)}
@media(min-width:900px),(orientation:landscape) and (max-height:540px){.grab{display:none}}
.head{padding:0 16px 0;flex:none;touch-action:none}
.brand{display:flex;align-items:center;gap:10px;padding:2px 0 10px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media(max-width:899px) and (orientation:portrait),(max-width:899px) and (min-height:541px){.brand{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}}
@media(min-width:900px),(orientation:landscape) and (max-height:540px){.brand{padding-top:16px}}
.brand h1{font-size:21px;line-height:1;font-weight:800;margin:0;letter-spacing:-.02em}
.brand .pg{margin-left:auto;font-size:13px;color:var(--soft);text-align:right;line-height:1.25;white-space:nowrap}
.brand .pg b{color:var(--ink)}
@media(max-width:1180px){.brand .pg{display:none}}
.srch{position:relative}
.srch input[type=search]{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 40px 0 42px;font-size:16px;touch-action:auto}
.srch>svg{position:absolute;left:14px;top:13px;width:20px;height:20px;color:var(--faint)}
.srch input::-webkit-search-cancel-button{display:none}
.srch .x{position:absolute;right:4px;top:3px;width:40px;height:40px;border:0;background:none;color:var(--soft);font-size:20px;display:none}
.srch.has .x{display:block}
#view:has(.pbar){padding-bottom:0}
#view{overflow-y:auto;flex:1;min-height:0;overscroll-behavior:contain;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.pad{padding:0 16px}
h2:focus{outline:none}h2{font-size:clamp(26px,7vw,36px);line-height:1.05;letter-spacing:-.02em;margin:14px 0 6px;font-weight:800;text-wrap:balance}
h3{font-size:19px;margin:26px 0 10px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
h3 small{font-size:14px;color:var(--soft);font-weight:500}
h3 .more{margin-left:auto;border:0;background:none;color:var(--pinkink);font-weight:700;font-size:14px;padding:4px 0}
.crumb{border:0;background:none;color:var(--pinkink);font-weight:700;font-size:15px;min-height:44px;padding:0;margin-top:6px;display:block}
.lead{color:var(--soft);margin:0 0 14px;font-size:15px;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:8px 0 14px}
.stat{background:var(--card);border-radius:14px;padding:10px 10px 8px}
.stat b{display:block;font-size:24px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--soft);line-height:1.2;display:block;margin-top:4px}
button.stat{border:0;text-align:left;color:inherit;font:inherit}button.stat:hover{background:var(--card2)}
.mix{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px}

.mixkey{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mixkey button{min-height:40px;border:1px solid var(--line);border-radius:20px;background:var(--bg);padding:0 12px;display:flex;gap:6px;align-items:center;color:var(--ink);font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-padding-inline:16px;padding:2px 16px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.pc{flex:none;width:200px;scroll-snap-align:start;border:0;background:none;padding:0;text-align:left}
.pc .art{width:200px;height:128px;border-radius:14px;overflow:hidden;display:block;position:relative}
.pc .art svg{width:100%;height:100%;display:block}
.pc .t{font-weight:700;line-height:1.2;margin-top:7px;font-size:15px}
.pc .s{font-size:13px;color:var(--soft)}
.tier{position:absolute;left:8px;top:8px;font-size:13px;font-weight:800;border-radius:8px;padding:1px 8px;background:rgba(255,255,255,.92);color:#16181d}
.tier.icon{background:#16181d;color:#ffd166}.tier.gem{background:#fff;color:#7b4fc4}
.trail{flex:none;width:250px;scroll-snap-align:start;border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:0;text-align:left;overflow:hidden}

.trail div.b{padding:10px 12px 12px}
.trail b{display:block;font-size:16px;line-height:1.2}
.trail span{font-size:13px;color:var(--soft)}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--bg);font-size:14px;padding:0 12px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip svg{width:16px;height:16px}
.lhead{padding-bottom:10px;border-bottom:1px solid var(--line)}
.sticky{position:sticky;top:0;background:var(--bg);z-index:2;padding-bottom:6px;border-bottom:1px solid var(--line)}
.meta{font-size:13px;color:var(--soft);padding:6px 16px 0}
ul{list-style:none;margin:0;padding:0}
.it{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:none;width:100%;border-left:0;border-right:0;border-top:0;text-align:left}
.it:hover,.it:focus-visible{background:var(--card)}
.thumb{width:52px;height:52px;border-radius:12px;overflow:hidden;position:relative}
.thumb svg{width:100%;height:100%;display:block}
.thumb .n{position:absolute;left:3px;bottom:2px;font-size:12px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.it .nm,.it .sub,.blk{display:block}.it .nm{font-weight:700;line-height:1.2}
.it .sub{font-size:13px;color:var(--soft);line-height:1.35;margin-top:2px}
.it .r{font-size:13px;color:var(--soft);text-align:right;white-space:nowrap;display:grid;gap:2px;justify-items:end}
.flag{font-size:12px;font-weight:700;color:var(--pinkink)}
.badge{font-size:12px;font-weight:700;border-radius:7px;padding:0 6px;white-space:nowrap;display:inline-block;line-height:18px}
.b-icon{background:#16181d;color:#ffd166}.b-gem{background:light-dark(#efe7fb,#2c2140);color:light-dark(#6a3fb5,#c8a8ff)}
.hero{position:relative;height:210px;overflow:hidden}
@media(max-width:899px) and (orientation:portrait),(max-width:899px) and (min-height:541px){.hero{height:112px}}
.hero svg{width:100%;height:100%;display:block}
.back{position:absolute;left:12px;top:12px;height:44px;border-radius:22px;border:0;background:rgba(255,255,255,.94);color:#16181d;font-weight:700;padding:0 14px 0 10px;box-shadow:0 2px 10px rgba(0,0,0,.15);display:flex;align-items:center;gap:4px}
.pn{position:absolute;right:12px;top:12px;display:flex;gap:6px}

.kick{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--soft);margin-top:14px;flex-wrap:wrap}
.why{font-size:17px;line-height:1.45;margin:6px 0 14px}

.ring2{width:120px;height:120px;flex:none}

@media(min-width:900px),(orientation:landscape) and (max-height:540px){.toast{top:20px;left:calc(440px + (100% - 440px)/2)}}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.sync{font-size:13px;color:var(--soft);padding:14px 16px 0}

function legs(ps){const o=[];for(let i=1;i<ps.length;i++)o.push(km(ps[i-1],ps[i]));return o}
function optimise(ps){if(ps.length<4)return ps;let best=[ps[0]],rest=ps.slice(1);while(rest.length){const l=best[best.length-1];let bi=0;rest.forEach((p,i)=>{if(km(l,p)<km(l,rest[bi]))bi=i});best.push(rest.splice(bi,1)[0])}
  let imp=true;const tot=a=>legs(a).reduce((x,y)=>x+y,0);while(imp){imp=false;for(let i=1;i<best.length-2;i++)for(let j=i+1;j<best.length-1;j++){const n=[...best.slice(0,i),...best.slice(i,j+1).reverse(),...best.slice(j+1)];if(tot(n)<tot(best)-.01){best=n;imp=true}}}return best}

/* day-by-day schedule: days start at 9:00, end by about 18:30; road time at ~45 km/h */
function tripPlan(ps){const L=legs(ps),out=[];let d=0,cur=9;ps.forEach((p,i)=>{const drive=i?road(L[i-1])/45:0,need=hrs(p);
    if(need>=18){if(i&&cur>9){d++;cur=9}const md=p.time.match(/(\d+)(?:–\d+)?\s*days?/),n=Math.max(1,md?+md[1]:Math.round(need/24));out.push({d,d2:d+n-1,a:cur+drive,b:null,multi:true});d+=n;cur=9;return}
    if(i&&cur+drive+Math.min(need,8)>18.5&&cur>9){d++;cur=9}const a=cur+drive,b=a+Math.min(need,9.5);out.push({d,a,b});cur=b+.25});return out}
const tripDays=ps=>tripPlan(ps).map(x=>x.d);
const hm=h=>{h=Math.min(h,23.99);let H=Math.floor(h),m=Math.round((h-H)*4)*15;if(m===60){H++;m=0}return`${H}:${String(m).padStart(2,"0")}`};
const dayDate=d=>{if(!M.tripStart)return"";const t=new Date(M.tripStart+"T00:00");t.setDate(t.getDate()+d);return t.toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"})};
function tripICS(ps,pl){const pad=n=>String(n).padStart(2,"0"),dt=(d,h)=>{const t=new Date(M.tripStart+"T00:00");t.setDate(t.getDate()+d);const H=Math.floor(Math.min(h,23.75)),m=Math.round((Math.min(h,23.75)-H)*60);return`${t.getFullYear()}${pad(t.getMonth()+1)}${pad(t.getDate())}T${pad(H)}${pad(m)}00`},esc_=s=>String(s).replace(/[\\,;]/g,x=>"\\"+x).replace(/\n/g,"\\n");
  const ev=ps.map((p,i)=>{const s=pl[i],st=stOf(p.slug).name;return["BEGIN:VEVENT",`UID:ita-${id(p).replace(":","-")}-${i}@india-travel-atlas`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,"").slice(0,15)}Z`,s.multi?`DTSTART;VALUE=DATE:${dt(s.d,0).slice(0,8)}`:`DTSTART:${dt(s.d,s.a)}`,s.multi?`DTEND;VALUE=DATE:${dt(s.d2+1,0).slice(0,8)}`:`DTEND:${dt(s.d,s.b)}`,`SUMMARY:${esc_(p.name)}`,`LOCATION:${esc_(p.district+", "+st)}`,`GEO:${p.lat};${p.lng}`,`DESCRIPTION:${esc_((p.why||p.category)+" · India Travel Atlas")}`,"END:VEVENT"].join("\r\n")});
  return["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//India Travel Atlas//EN","CALSCALE:GREGORIAN",...ev,"END:VCALENDAR"].join("\r\n")}

async function getStory(p){const pid=id(p);if(S.story[pid]?.text)return S.story[pid].text;const r=await CAP.sample(`Write a spoken audio-guide narration of about 110 words for a visitor arriving at the place below. Warm, vivid and accurate. Mention what makes it special and one thing to look out for. Do not invent dates, numbers or legends you are unsure of. Plain text only, no headings or lists.\n\n${placeCtx(p)}`,{cache:{gcTime:86400000}});S.story[pid]={text:r.text};return r.text}
function storyBlock(p){if(!CAP.sample)return"";const s=S.story[id(p)];return`<h3>Audio guide</h3><div class="acts" style="grid-template-columns:repeat(${CAP.tts?2:1},minmax(0,1fr))"><button class="act" id="stbtn">${s?.busy?"Writing the story…":s?.text?"Story shown below":"Read the story"}</button>${CAP.tts?`<button class="act" id="lsbtn" aria-pressed="false">▶ Listen</button>`:""}</div><div class="ans" id="story"${s?.text?"":" hidden"}>${s?.text?`<p>${esc(s.text)}</p><p class="note">Written by Claude for this atlas.</p>`:""}</div>`}
function bindStory(p){if(!CAP.sample)return;const pid=id(p);const show=t=>{const el=$("#story");if(el&&S.sel&&id(S.sel)===pid){el.hidden=false;el.innerHTML=`<p>${esc(t)}</p><p class="note">Written by Claude for this atlas.</p>`}};
  $("#stbtn").onclick=async()=>{const b=$("#stbtn");b.textContent="Writing the story…";b.disabled=true;try{show(await getStory(p))}catch(e){toast(errMsg(e))}b.disabled=false;b.textContent="Story shown below"};
  const lb=$("#lsbtn");if(lb&&CAP.tts){let speaking=false;const set=on=>{speaking=on;lb.textContent=on?"■ Stop":"▶ Listen";lb.setAttribute("aria-pressed",on)};
    lb.onclick=async()=>{if(speaking){try{await CAP.tts.stop()}catch(e){}set(false);return}set(true);lb.textContent="Preparing…";try{const t=await getStory(p);show(t);lb.textContent="■ Stop";await CAP.tts.speak(t,{language:"en"})}catch(e){if(e&&e.code&&e.code!=="stopped")toast(e.code==="not_granted"?"Reading aloud is turned off for this page":errMsg(e))}set(false)}}}

/* ---- travel diary on a place ---- */
const today=()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
function diaryBlock(p){const pid=id(p);if(!M.been[pid])return"";const v=(M.visits||{})[pid]||{},ph=(M.photos||{})[pid]||[];
  return`<div class="pcard"><h3 style="margin:0 0 8px">My visit</h3><div class="pgrid"><label class="lbl">Date<input type="date" id="vdate" value="${esc(v.date||"")}" max="${today()}"></label><div><span class="lbl" id="rateL">Rating</span><div class="stars" role="group" aria-labelledby="rateL">${[1,2,3,4,5].map(n=>`<button class="star${(v.rating||0)>=n?" on":""}" data-star="${n}" aria-label="${n} star${n>1?"s":""}" aria-pressed="${(v.rating||0)===n}">★</button>`).join("")}</div></div></div>
   <span class="lbl" style="margin-top:10px;display:block">Photos</span><div class="photos">${ph.map((pidA,i)=>`<div class="ph"><img src="/_blob/${esc(pidA)}" alt="Your photo ${i+1} of ${esc(p.name)}" loading="lazy">${CAP.assets?`<button class="phx" data-rmph="${i}" aria-label="Remove photo ${i+1}">×</button>`:""}</div>`).join("")}${CAP.assets?`<label class="phadd"><input type="file" id="phin" accept="image/*" multiple class="sr"><span>＋ Add photos</span></label>`:ph.length?"":`<p class="note" style="margin:0">Adding photos works for the atlas owner on claude.ai.</p>`}</div></div>`}
function bindDiary(p){const pid=id(p);if(!M.been[pid])return;M.visits=M.visits||{};M.photos=M.photos||{};const v=M.visits[pid]=M.visits[pid]||{date:today(),rating:0};
  $("#vdate").onchange=e=>{v.date=e.target.value;save()};
  V.querySelectorAll("[data-star]").forEach(b=>b.onclick=()=>{const n=+b.dataset.star;v.rating=v.rating===n?0:n;save();V.querySelectorAll("[data-star]").forEach(x=>{x.classList.toggle("on",+x.dataset.star<=v.rating);x.setAttribute("aria-pressed",+x.dataset.star===v.rating)});say(v.rating?`Rated ${v.rating} out of 5`:"Rating cleared")});
  const fi=$("#phin");if(fi)fi.onchange=async()=>{const files=[...fi.files].slice(0,10);if(!files.length)return;toast(`Uploading ${files.length} photo${files.length>1?"s":""}…`);let ok=0;
    for(const f of files){try{const blob=await shrink(f);const r=await CAP.assets.upload(blob,{type:"image/jpeg"});(M.photos[pid]=M.photos[pid]||[]).push(r.id);ok++}catch(e){toast(e&&e.code==="quota_or_state"?"Photo storage is full":"A photo couldn't be uploaded")}}
    save();paint(false,V.scrollTop);if(ok)toast(`${ok} photo${ok>1?"s":""} added`)};
  V.querySelectorAll("[data-rmph]").forEach(b=>b.onclick=()=>{const i=+b.dataset.rmph,arr=M.photos[pid],gone=arr.splice(i,1)[0];save();paint(false,V.scrollTop);let undone=false;
    toast("Photo removed",()=>{undone=true;arr.splice(i,0,gone);save();paint(false,V.scrollTop)});setTimeout(()=>{if(!undone&&CAP.assets)CAP.assets.delete(gone).catch(()=>{})},6500)})}
function shrink(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const m=1600,s=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej({code:"invalid_request"}),"image/jpeg",.85)};img.onerror=()=>{URL.revokeObjectURL(u);rej({code:"unsupported_type"})};img.src=u})}

/* ---- passport extras: my India map, diary, year card ---- */
function miniMap(w,h,been){const s=Math.min(w/(29.3*CL),h/30.35)*.96,x0=(w-29.3*CL*s)/2,y0=(h-30.35*s)/2,Pm=(lng,lat)=>[x0+(lng-68.1)*CL*s,y0+(37.1-lat)*s];
  const pth=d3.geoPath(d3.geoTransform({point(x,y){const q=Pm(x,y);this.stream.point(q[0],q[1])}}));const vs=new Set(been.map(p=>stOf(p.slug).name));
  return{Pm,pth,svg:`<svg viewBox="0 0 ${w} ${h}" class="mini" role="img" aria-label="Map of India with ${vs.size} states visited">${S.feats.map(f=>`<path d="${pth(f)}" fill="${vs.has(f.properties.st_nm)?"#f7b3cc":"var(--land)"}" stroke="var(--edge)" stroke-width=".6"/>`).join("")}${been.map(p=>{const[x,y]=Pm(p.lng,p.lat);return`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.2" fill="#e5246b" stroke="#fff" stroke-width="1"/>`}).join("")}</svg>`}}
function passportExtras(been){const vis=M.visits||{},yr=new Date().getFullYear(),thisYr=been.filter(p=>(vis[id(p)]?.date||"").startsWith(String(yr))),rated=been.map(p=>vis[id(p)]?.rating||0).filter(Boolean),avg=rated.length?(rated.reduce((a,b)=>a+b,0)/rated.length).toFixed(1):"–";
  return`<h3>My India</h3><div class="minibox">${miniMap(320,340,been).svg}</div>
   <div class="stats" style="margin-top:10px"><div class="stat"><b>${been.length}</b><span>places</span></div><div class="stat"><b>${new Set(been.map(p=>p.slug)).size}</b><span>states</span></div><div class="stat"><b>${thisYr.length}</b><span>in ${yr}</span></div><div class="stat"><b>${avg}</b><span>avg rating</span></div></div>`}
function passportDiary(been){const vis=M.visits||{};const diary=been.map(p=>[p,vis[id(p)]?.date||""]).sort((a,b)=>(b[1]||"").localeCompare(a[1]||""));const groups={};diary.forEach(([p,d])=>{const k=d?new Date(d+"T00:00").toLocaleDateString("en-IN",{month:"long",year:"numeric"}):"Undated";(groups[k]=groups[k]||[]).push([p,d])});
  return`<h3>Travel diary</h3>${diary.length?Object.entries(groups).map(([k,a])=>`<p class="dgrp">${esc(k)}</p><ul>${a.map(([p,d])=>{const v=vis[id(p)]||{},n=((M.photos||{})[id(p)]||[]).length;return row(p,{state:1,mb:0}).replace('<span class="r">',`<span class="r">${v.rating?`<span style="color:#e3a008" aria-label="${v.rating} stars">${"★".repeat(v.rating)}</span>`:""}${n?`<span>${n} photo${n>1?"s":""}</span>`:""}`)}).join("")}</ul>`).join(""):`<p class="note">Mark places as been to start your diary. Add the date, a rating and photos on each place.</p>`}`}
async function yearCard(){const yr=new Date().getFullYear(),all=allPlaces(),vis=M.visits||{},been=all.filter(p=>M.been[id(p)]),yrB=been.filter(p=>(vis[id(p)]?.date||"").startsWith(String(yr))),list=(yrB.length?yrB:been);
  const c=document.createElement("canvas");c.width=1080;c.height=1350;const x=c.getContext("2d");x.fillStyle="#12161d";x.fillRect(0,0,1080,1350);x.fillStyle="#e5246b";x.fillRect(0,0,1080,210);
  x.fillStyle="#fff";x.font="800 72px Mukta, sans-serif";x.fillText(`My India ${yr}`,64,130);x.font="500 32px Mukta, sans-serif";x.fillText("India Travel Atlas",66,180);
  const {Pm,pth}=miniMap(620,680,list);x.save();x.translate(400,260);S.feats.forEach(f=>{const p2=new Path2D(pth(f));const v=list.some(p=>stOf(p.slug).name===f.properties.st_nm);x.fillStyle=v?"#f7b3cc":"#1f2633";x.fill(p2);x.strokeStyle="#3c4a5c";x.lineWidth=1;x.stroke(p2)});
  list.forEach(p=>{const[a,b]=Pm(p.lng,p.lat);x.beginPath();x.arc(a,b,6,0,7);x.fillStyle="#e5246b";x.fill();x.lineWidth=2;x.strokeStyle="#fff";x.stroke()});x.restore();
  const st=[[list.length,"places"],[new Set(list.map(p=>p.slug)).size,"states"],[new Set(list.map(p=>p.g)).size,"kinds of place"]];x.fillStyle="#fff";st.forEach(([n,l],i)=>{x.font="800 96px Mukta, sans-serif";x.fillText(String(n),64,380+i*190);x.font="500 34px Mukta, sans-serif";x.fillStyle="#aeb5c4";x.fillText(l,68,425+i*190);x.fillStyle="#fff"});
  x.font="700 34px Mukta, sans-serif";x.fillText(yrB.length?"Highlights":"Places I've been",64,1010);x.font="500 30px Mukta, sans-serif";x.fillStyle="#d6dae2";
  [...list].sort((a,b)=>((vis[id(b)]?.rating||0)-(vis[id(a)]?.rating||0))||(tierW[b.tier]-tierW[a.tier])).slice(0,6).forEach((p,i)=>x.fillText(`${p.name} · ${stOf(p.slug).name}`.slice(0,58),64,1062+i*46));
  const blob=await new Promise(r=>c.toBlob(r,"image/png"));try{await CAP.downloads.save({filename:`my-india-${yr}.png`,data:blob});toast("Card saved")}catch(e){if(e.code!=="declined")toast("Couldn't save the card here")}}

/* ---------- data + boot ---------- */
function fromIndex(slug,x){return{intro:x.intro,bases:x.bases,trails:x.trails,festivals:x.festivals,places:x.p.map(r=>({n:r[0],name:r[1],district:r[2],category:r[3],g:r[4],lat:r[5],lng:r[6],tier:r[7],months:[r[8],r[9]],time:r[10],tags:r[11]?r[11].split(" "):[],why:"",slug}))}}
async function loadState(slug){if(S.data[slug])return S.data[slug];const d=await (await fetch("data/places/"+slug+".json")).json();d.places.forEach(p=>{p.slug=slug;p.tags=p.tags||[]});S.data[slug]=d;S.full[slug]=Promise.resolve(true);return d}
function ensureFull(slug){if(S.full[slug])return S.full[slug];S.full[slug]=fetch("data/places/"+slug+".json").then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{const m={};d.places.forEach(q=>m[q.n]=q.why);(S.data[slug]?.places||[]).forEach(p=>{p.why=m[p.n]||"";p._h=null});return true}).catch(e=>{delete S.full[slug];throw e});return S.full[slug]}
async function goIndia(){S.slug=null;S.sel=null;S.hl=null;S.trail=null;S.f={...S.f,dist:null};S.stack=[{v:"explore"}];S.tab="explore";setTabs("explore");clearQ();classStates();paint(true);drawPins();drawRoute();sizePins();drawHome();fitIndia()}
async function openState(slug,focus){await loadState(slug);ensureFull(slug).catch(()=>{});S.slug=slug;S.sel=null;S.hl=null;S.trail=null;S.f={...S.f,dist:null};classStates();clearQ();
  S.tab="explore";S.stack=[{v:"explore"}];setTabs("explore");paint();drawPins();drawRoute();drawHome();if(focus)focusState()}
function route(silent,h0){const h=h0!=null?h0:location.hash.slice(1);const m=h.match(/^(.*)-(\d+)$/);
  if(m&&S.data[m[1]]){const p=S.data[m[1]].places.find(x=>x.n==m[2]);if(p){S.slug=m[1];classStates();S.stack=[{v:"explore"}];openPlace(p,!silent);return}}
  paint()}
(async()=>{
  try{
    const[topo,states,fx]=await Promise.all([fetch("data/india-states.json").then(r=>r.json()),fetch("data/states.json").then(r=>r.json()),fetch("data/festivals.json").then(r=>r.json()).catch(()=>[])]);S.fx=fx;
    S.topo=topo;S.feats=topojson.feature(topo,topo.objects.states).features;S.states=states;
    let ix=null;try{ix=await fetch("data/index.json").then(r=>{if(!r.ok)throw 0;return r.json()})}catch(e){}
    if(ix)states.forEach(s=>{if(ix[s.slug])S.data[s.slug]=fromIndex(s.slug,ix[s.slug])});
    await Promise.all(states.filter(s=>s.status==="done"&&!S.data[s.slug]).map(s=>loadState(s.slug)));
    try{if(sessionStorage.getItem("ita-refreshed")){sessionStorage.removeItem("ita-refreshed");setTimeout(()=>toast(`Atlas refreshed · ${allPlaces().length.toLocaleString("en-IN")} places`),400)}}catch(e){}
    fit();drawBase();
    Promise.all([fetch("data/rivers.json").then(r=>r.json()),fetch("data/terrain.json").then(r=>r.json())]).then(([r,t])=>{S.riv=r;S.ter=t;drawGeo();queueLabels()}).catch(()=>{});
    const h=location.hash.slice(1),m=h.match(/^(.*?)(?:-(\d+))?$/);
    const first=h?states.find(s=>s.status==="done"&&(h===s.slug||h.startsWith(s.slug+"-"))):null;
    if(first){await openState(first.slug,false);if(h!==first.slug&&h.startsWith(first.slug+"-"))route(false,h);else setTimeout(()=>focusState(1000),250)}
    else{S.slug=null;S.stack=[{v:"explore"}];classStates();paint();drawPins();drawHome();setTimeout(fitIndia,250)}
    if(!M.onboarded)setTimeout(()=>{if(!M.onboarded)showOnboard(false)},900);
  }catch(e){V.innerHTML=`<div class="empty">Couldn't load the atlas. Reload to try again.</div>`;console.error(e)}
  addEventListener("hashchange",()=>{if(Date.now()-ignHashT<600)return;const h=location.hash.slice(1);const s=S.states.find(x=>x.slug===h);if(s&&s.status==="done"&&h!==S.slug)openState(s.slug,true);else if(/-\d+$/.test(h)&&!(S.sel&&h===S.sel.slug+"-"+S.sel.n))route(false)});
})();
}
</script>
<script>if("serviceWorker"in navigator)addEventListener("load",()=>{const sw=navigator.serviceWorker,had=!!sw.controller;let re=0;sw.addEventListener("controllerchange",()=>{if(had&&!re){re=1;location.reload()}});sw.register("sw.js",{updateViaCache:"none"}).then(g=>{const u=()=>g.update().catch(()=>{});document.addEventListener("visibilitychange",()=>{if(!document.hidden)u()});setInterval(u,36e5)}).catch(()=>{})})</script>
