.wxd{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px;border-radius:12px;background:var(--bg);font-size:12px;border:1px solid transparent}.wxd span{color:var(--soft);font-size:11.5px}.wxd i{font-style:normal;font-size:20px;line-height:1.3}.wxd b{font-size:14px}.wxd small{color:var(--soft)}.wxd em{font-style:normal;font-size:11px;color:#1f78d1;min-height:14px}
.wxd.wx-bad{background:light-dark(#fff1e6,#2e1f12);border-color:light-dark(#f5c08a,#6b4520)}.wxd.trip{border-color:var(--pink);border-width:2px}
.twx{font-size:12.5px;font-weight:600}.twx.wx-ok{color:light-dark(#18794e,#4cc38a)}.twx.wx-meh{color:light-dark(#8a5a00,#e3b341)}.twx.wx-bad{color:light-dark(#b42318,#ff7b6e)}
.twxw{font-size:12px;margin-top:2px}.twxw.wx-bad{color:light-dark(#b42318,#ff7b6e)}.twxw.wx-meh{color:light-dark(#8a5a00,#e3b341)}
.twxa{display:flex;flex-direction:column;gap:6px;margin-top:10px;padding:12px 14px;border-radius:16px;background:light-dark(#fff1e6,#2e1f12);border:1px solid light-dark(#f5c08a,#6b4520);font-size:14px}.twxa .act{margin-top:2px}.twxa .m2{font-size:13px;color:var(--soft)}
.twxn{margin:10px 0 0}
.wayon .route{display:none}
.lgm{flex:none;width:40px;height:40px;display:block}.lgm svg{width:40px;height:40px;display:block}
.lgtr{fill:none;stroke:var(--line);stroke-width:2.2}.lgpr{fill:none;stroke:var(--pink);stroke-width:2.6;stroke-linecap:round;transition:stroke-dasharray .6s ease}
.lgbg{fill:var(--pinksoft)}.lgsh{fill:var(--pink);stroke:var(--pink);stroke-width:.4;stroke-linejoin:round}
#lgE{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--pinkink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{padding:6px 10px 6px 6px;gap:10px;border-radius:18px}.legend b{font-size:16.5px;letter-spacing:-.01em}
.accs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:4px 0 14px}
.acc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px 8px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font:inherit;font-size:11.5px;font-weight:700;color:var(--ink);line-height:1.15;text-align:center;min-height:76px}
.acc i{width:30px;height:30px;border-radius:50%;background:var(--a);box-shadow:inset 0 0 0 2px color-mix(in srgb,#fff 25%,transparent)}
.acc i{outline:1px solid color-mix(in srgb,var(--ink) 22%,transparent);outline-offset:0}.acc[aria-checked=true]{border-color:var(--pink);box-shadow:0 0 0 2px var(--pink)}.acc[aria-checked=true] i{box-shadow:inset 0 0 0 3px var(--bg),0 0 0 2px var(--pink)}
/* this weekend */
.wkc{margin:14px 16px 4px;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:var(--card);box-shadow:0 6px 22px rgba(10,20,40,.08)}
.wkimg{position:relative;display:block;width:100%;height:170px;border:0;padding:0;background:#16181d;cursor:pointer}.wkimg>.pic,.wkimg img{border-radius:0}
.wkx{padding:14px 16px 12px}
.wke{display:block;font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--pinkink)}
.wkc h3{margin:4px 0 2px;font-size:23px;line-height:1.15;letter-spacing:-.01em}.wkn{border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.wks{margin:0;color:var(--soft);font-size:14px}
.wkr{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:5px;font-size:14.5px;line-height:1.35}
.wkw{margin:10px 0 0;font-size:13.5px;color:var(--soft);line-height:1.5}.wkw .lnk2{font-size:13.5px;padding:2px 0;min-height:0;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.wka{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:8px;margin-top:12px}.wka .act{margin:0}.wk0 .wka{grid-template-columns:1fr}
.wko{list-style:none;margin:10px -16px 0;padding:0;border-top:1px solid var(--line)}.wko .it{background:none}
.wkn2{font-size:12.5px;margin:10px 0 0}
/* on-trip mode */
.seg5{grid-template-columns:repeat(5,minmax(0,1fr))}.seg5 button{font-size:13.5px}
.tde{display:block;font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--pinkink)}
.tdy{margin-top:6px}.tdh2{padding:12px 14px;border-radius:18px;background:var(--pinksoft)}.tdl{display:grid;gap:3px;margin-top:6px;font-size:14.5px}
.tdwx.wx-bad,.tdw.wx-bad{color:light-dark(#b42318,#ff7b6e)}.tdwx.wx-meh,.tdw.wx-meh{color:light-dark(#8a5a00,#e3b341)}
.tdn{margin-top:12px;padding:14px;border-radius:20px;border:2px solid var(--pink);background:var(--bg)}
.tdnb{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;width:100%;margin-top:8px;padding:0;border:0;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}.tdnb .thumb{width:64px;height:64px;border-radius:14px}.tdnb b{font-size:19px;line-height:1.2}
.tdw{font-size:13px;margin-top:3px}
.tda{display:grid;grid-template-columns:1.3fr 1fr auto;gap:8px;margin-top:12px}.tda .act{margin:0;min-height:48px}.tda .ghost{padding:0 14px}
.tdone{border-style:dashed;display:flex;flex-direction:column;gap:2px}.tdone b{font-size:19px}
.tdls{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tdls li{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line);font-size:14.5px}.tdls li:last-child{border-bottom:0}
.tdls .tdt{color:var(--soft);font-size:13px;font-variant-numeric:tabular-nums}.tdls .lnk2{text-align:left;font-weight:700;color:var(--ink);min-height:40px}.tdls .tds{font-size:12.5px;color:var(--soft)}
.tdls li.dn .lnk2{color:var(--soft);text-decoration:line-through}.tdls li.dn .tds{color:light-dark(#18794e,#4cc38a);font-weight:800}.tdls li.nx{background:color-mix(in srgb,var(--pink) 7%,var(--bg))}.tdls li.nx .tds{color:var(--pinkink);font-weight:800}
.tdnt{margin-top:12px;padding:10px 14px;border-radius:14px;background:var(--card);font-size:14.5px}
.tdtm{margin-top:10px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);display:grid;gap:2px;font-size:14.5px}
.tnc{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;margin:14px 16px 0;width:calc(100% - 32px);padding:12px;border-radius:18px;border:2px solid var(--pink);background:var(--bg);font:inherit;color:inherit;text-align:left;cursor:pointer}.tnc .thumb{width:56px;height:56px;border-radius:14px}.tnc b{font-size:17px}.tnc .r{font-size:22px;color:var(--soft)}.tnc.soon{border-style:dashed}
/* poster */
.pstc{max-width:460px}.pstf{margin:6px 0 10px}.pstv{border-radius:14px;overflow:hidden;background:#0f1319;min-height:120px;display:grid;place-items:center}.pstv img{display:block;width:100%;height:auto;max-height:56vh;object-fit:contain}
/* food */
.tfood{font-size:12.5px}.tfood b{color:var(--ink)}.tdfood{font-size:14.5px}
.wfl{list-style:none;margin:6px 0 0;padding:0;border:1px solid var(--line);border-radius:18px;overflow:hidden}.wfl li{display:flex;gap:4px;align-items:center;padding:9px 12px 9px 0;border-bottom:1px solid var(--line);font-size:14.5px}.wfl li:last-child{border-bottom:0}.wfl .m2{font-size:13px;color:var(--soft)}.wfw{font-size:12px;color:var(--pinkink);font-weight:700;margin-top:1px}
/* memories */
.memc{max-width:440px}.memph{display:block;margin-top:10px;cursor:pointer}.mempv{display:grid;place-items:center;aspect-ratio:4/3;border-radius:16px;overflow:hidden;border:2px dashed var(--line);background:var(--card)}.mempv img{width:100%;height:100%;object-fit:cover}
.memph:focus-within .mempv{outline:2px solid var(--pink);outline-offset:2px}.memadd{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--soft);font-size:28px}.memadd b{font-size:16px;color:var(--ink)}.memadd span{font-size:13px}
.memcard{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:center;margin:14px 16px 0;width:calc(100% - 32px);padding:10px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(135deg,color-mix(in srgb,var(--pink) 10%,var(--bg)),var(--bg));font:inherit;color:inherit;text-align:left;cursor:pointer}
.memi{position:relative;width:96px;height:96px;border-radius:14px;overflow:hidden;display:block;background:var(--card)}.memi img{width:100%;height:100%;object-fit:cover;display:block}.memcard b{font-size:18px;margin-top:2px}.meml{font-family:Georgia,serif;font-style:italic;font-size:15px;line-height:1.35;margin-top:3px}
.jq{font-style:italic}
/* before you go */
.bygl{list-style:none;margin:0;padding:0;display:grid;gap:9px}.bygl li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:6px;font-size:15px;line-height:1.35}.bygi{font-size:17px}
.bygl b.ok{color:light-dark(#18794e,#4cc38a)}.bygl b.no{color:light-dark(#b42318,#ff7b6e)}.bygl .m2{font-size:13px;word-break:break-word}.bygl a{color:var(--pinkink);font-weight:700}
.bygs{margin:10px 0 0;font-size:12.5px}.bygs a{color:inherit}
/* near me now */
.nnh b{color:var(--ink)}.nnf{display:block;font-size:12.5px;margin-top:1px;font-weight:600}.nnf.ok{color:light-dark(#18794e,#4cc38a)}.nnf.no{color:var(--soft);font-weight:500}
/* offline packs */
.pkl{list-style:none;margin:6px 0 0;padding:0;border:1px solid var(--line);border-radius:14px;overflow:hidden}.pkl:empty{display:none}
.pkr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 8px 8px 14px;border-bottom:1px solid var(--line)}.pkr:last-child{border-bottom:0}.pkr .act{margin:0;min-width:104px}
/* friends */
.tfrb{margin-top:10px;padding:12px 14px;border-radius:16px;background:var(--card);font-size:14px;display:grid;gap:3px}.tfra{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}.tfra .act{margin:0;flex:1}
.tvt{font-size:12.5px;font-weight:700;color:var(--pinkink);margin-top:2px}
.vtl{list-style:none;margin:0;padding:0}.vtr{display:flex;align-items:center;border-bottom:1px solid var(--line)}.vtr .it{flex:1;min-width:0;border-bottom:0}
.vtb{display:flex;gap:6px;padding-right:14px}.vtb button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:19px;filter:grayscale(1);opacity:.65}.vtb button[aria-pressed=true]{filter:none;opacity:1;border-color:var(--pink);background:var(--pinksoft)}
/* crowd calendar */
.crc summary{display:flex;justify-content:space-between;align-items:center;cursor:pointer;min-height:40px;list-style:none}.crc summary::-webkit-details-marker{display:none}
.crh,.crg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.crh{margin:8px 0 4px;font-size:11px;color:var(--soft);text-align:center}
.crd{position:relative;aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px}.crd b{font-weight:700}.crd i{font-style:normal;font-size:9.5px;line-height:1;position:absolute;top:3px;left:4px;color:var(--soft);font-weight:700}
.cr-good{background:light-dark(#dff3e6,#173a26)}.cr-ok{background:light-dark(#eef6f0,#1a2a20)}.cr-busy{background:light-dark(#fff1cc,#3a2f12)}.cr-rush{background:light-dark(#ffd9d3,#4a1f1a)}.cr-off,.cr-no{background:light-dark(#eceef2,#232831);color:var(--soft)}.cr-past{opacity:.3}
.crl{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:12px;color:var(--soft)}.crl i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:4px;vertical-align:-1px}
/* ask */
.askf{display:grid;gap:8px;margin-top:10px}.askf textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.askr{margin-top:12px}.askp{margin-top:14px;padding:14px;border-radius:18px;border:1px solid var(--line)}.askp h3{margin:4px 0 6px}.askp h3 small{font-weight:600;color:var(--soft);font-size:14px}
.askl{margin:0 0 12px;padding-left:20px;display:grid;gap:4px;font-size:14.5px}.askl .lnk2{font-weight:700;color:var(--ink);min-height:0;padding:2px 0}
/* trek facts */
.trk .tkh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.tkk{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--pinkink)}
.tkg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tkr{padding:9px 11px;border-radius:12px;background:var(--bg)}.tkr>span{display:block;font-size:12px;color:var(--soft)}.tkr b{font-size:15px}
.tkd{color:var(--d)}.tkd::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--d);margin-right:6px;vertical-align:1px}
.tkp{display:flex;gap:8px;align-items:flex-start;margin:10px 0 0;font-size:14px}.tkp svg{width:18px;height:18px;flex:none;color:#b7791f;margin-top:1px}
/* layer detail cards */
.xdl{margin:0;display:grid;gap:6px}.xdl>div{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}.xdl>div:last-child{border-bottom:0}
.xdl dt{font-size:13px;color:var(--soft)}.xdl dd{margin:0;font-size:14.5px;font-weight:600;line-height:1.4}.xdl a{color:var(--pinkink)}
.xnote{margin:10px 0 0;font-size:14px;padding:9px 12px;border-radius:12px;background:var(--bg)}
.cirl{margin:0;padding-left:24px;list-style:decimal;display:grid;gap:4px}.cirl li{font-size:14px}.cirl li.on b{color:var(--pink)}.cirl button{all:unset;cursor:pointer;color:var(--ink);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--pink) 45%,transparent);text-underline-offset:3px}
.pmr{padding:8px 0;border-top:1px solid var(--line)}.pmr:first-of-type{border-top:0}.pmr p,.pml p{margin:4px 0 0;font-size:14px}.pmw{margin-left:6px;font-size:12px;color:var(--soft)}.pml{list-style:none;margin:0;padding:0;display:grid;gap:10px}.pml input{accent-color:var(--pink)}
.gfx rect{fill:var(--gold);stroke:var(--bg);stroke-width:1.5px;vector-effect:non-scaling-stroke;cursor:pointer}.gfx g:focus-visible rect{stroke:var(--pink);stroke-width:3px}
.st.oc{fill:var(--other);opacity:.6}.ccsw{display:flex;gap:6px;padding:4px 0 10px}.ccsw button{flex:1;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 15px Mukta,sans-serif;cursor:pointer}.ccsw button[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:#fff}
.cclist{display:grid;gap:10px;margin-top:12px}.ccard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font:inherit}.ccard:hover{border-color:var(--pink)}.ccm{flex:none;width:56px;height:56px;border-radius:14px;background:var(--pinksoft);display:grid;place-items:center}.ccm svg{width:46px;height:46px}.ccm path{fill:var(--pink)}.cct{flex:1;display:grid;gap:2px}.cct b{font-size:19px}.cct span{font-size:13px;color:var(--soft)}
</style>
</head>

function bindPlan(){const t=$("#ptext");if(!t)return;const r=S.preq;t.oninput=e=>r.text=e.target.value;$("#pdays").onchange=e=>r.days=+e.target.value;$("#pstart").onchange=e=>r.start=e.target.value;$("#pmonth").onchange=e=>r.month=+e.target.value;$("#ppace").onchange=e=>r.pace=e.target.value;

async function runPlan(opts,after){if(S.planBusy)return;S.planBusy=true;S.ctl=new AbortController();const upd=m=>{S.pmsg=m;const el=$("#pstat");if(el)el.textContent=m;const el2=$("#rstat");if(el2)el2.textContent=m};upd("Starting…");softPaint();
  try{const plan=await askPlan(opts,upd,S.ctl.signal);M.plans=(M.plans||[]).filter(x=>x.id!==plan.id);M.plans.unshift(plan);M.plans=M.plans.slice(0,30);save();S.planBusy=false;if(plan.shared)pushShared(plan);
    if(after)after(plan);else{remember();S.stack.push({v:"plan",a:plan.id});paint(true)}showPlanRoute(plan);toast("Your plan is ready")}

async function loadShared(){if(!CAP_DB())return;try{const q=await DB.collection("shared/plans").orderBy("updated","desc").limit(30).get();S.shared=q.docs.map(d=>({id:d.id,...d.data()}));const t=S.stack[S.stack.length-1];if(t&&t.v==="trip")softPaint()}catch(e){S.shared=[]}}
function unsubShared(){if(S.sub){S.sub.u.forEach(f=>{try{f()}catch(e){}});S.sub=null}}
function vShared(k){if(!CAP_DB()){V.innerHTML=`<div class="empty">Shared plans need you to be signed in.</div>`;return}
  if(!S.sub||S.sub.id!==k){unsubShared();const sub={id:k,plan:null,people:[],u:[],loading:true};S.sub=sub;
    const rer=()=>{const t=S.stack[S.stack.length-1];if(t&&t.v==="shared"&&t.a===k&&S.sub===sub){const y=V.scrollTop;vSharedBody(sub);bind();V.scrollTop=y}};
    sub.u.push(DB.doc("shared/plans/"+k).onSnapshot(s=>{sub.loading=false;sub.plan=s.exists?s.data():null;rer()},()=>{sub.loading=false;rer()}));
    sub.u.push(DB.collection("shared/plans/"+k+"/people").onSnapshot(q=>{sub.people=q.docs.map(d=>({id:d.id,...d.data()}));rer()},()=>{}));}
  vSharedBody(S.sub)}

   ${plan.days.map((d,i)=>`<h3 class="pad">Day ${i+1}<small>${esc(d.title)}</small></h3><ul>${d.ids.map(byId).filter(Boolean).map(p=>{const k=id(p),v=votes(k),me=!!(mine.votes&&mine.votes[k]);return`<li class="vrow">${row(p,{state:1}).replace(/^<li>|<\/li>$/g,"")}<button class="vote${me?" on":""}" data-vote="${k}" aria-pressed="${me}" aria-label="${me?"Remove your vote for":"Vote for"} ${esc(p.name)}, ${v} votes">▲ ${v}</button></li>`}).join("")}</ul>`).join("")}

   <label class="lbl" for="sugq">Suggest a stop</label><input id="sugq" type="search" placeholder="Search atlas places" autocomplete="off" style="width:100%"><ul id="sugr"></ul></div>`;
  const myRef=DB.doc("shared/plans/"+sub.id+"/people/"+UID);const write=async m=>{try{await myRef.set({votes:m.votes||{},adds:m.adds||[],t:Date.now()})}catch(e){toast("Couldn't save. You may only have view access")}};

  const sq=$("#sugq");sq.oninput=()=>{const t=sq.value.trim().toLowerCase();$("#sugr").innerHTML=t.length<2?"":allPlaces().filter(p=>p.name.toLowerCase().includes(t)).slice(0,6).map(p=>`<li><button class="it" data-sug="${id(p)}"><span class="thumb" aria-hidden="true">${art(p)}</span><span><span class="nm">${esc(p.name)}</span><span class="sub">${esc(stOf(p.slug).name)}</span></span><span class="r">Suggest</span></button></li>`).join("");
    $("#sugr").querySelectorAll("[data-sug]").forEach(b=>b.onclick=()=>{const m={votes:{...(mine.votes||{})},adds:[...new Set([...(mine.adds||[]),b.dataset.sug])]};write(m);sq.value="";$("#sugr").innerHTML="";toast("Suggested")})}}

/* ---- Ask Claude + story on a place ---- */
function md(t){return esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").split(/\n{2,}/).map(b=>/^\s*[-•] /m.test(b)?`<ul class="bul">${b.split("\n").filter(x=>x.trim()).map(x=>`<li>${x.replace(/^\s*[-•]\s*/,"")}</li>`).join("")}</ul>`:`<p>${b.replace(/\n/g,"<br>")}</p>`).join("")}
function placeCtx(p){const D=S.data[p.slug],near=D.places.filter(x=>x!==p).map(x=>[x,km(p,x)]).sort((a,b)=>a[1]-b[1]).slice(0,5),h=home();
  return`Place: ${p.name}
Kind: ${p.category} (${G[p.g][0]}); rating in this atlas: ${TIER[p.tier]}
Location: ${p.district} district, ${stOf(p.slug).name}, India (${p.lat.toFixed(3)}, ${p.lng.toFixed(3)})
Atlas note: ${p.why}
Best months: ${monthsTxt(p)}; time needed: ${p.time}
Nearby atlas places: ${near.map(([x,d])=>`${x.name} (${Math.round(d)} km)`).join("; ")}${h?`\nTraveller's home city: ${h.name} (about ${road(km(h,p))} km by road)`:""}`}
const QUICK=["How do I get there?","What should I eat nearby?","Tips before I go","Is it good for kids and older parents?"];
function askBlock(p){const pid=id(p),a=S.ans[pid];if(!CAP.sample)return"";
  return`<h3 id="askH">Ask Claude</h3><div class="tags">${QUICK.map(q=>`<button class="tag" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>
   <div style="display:flex;gap:8px;margin-top:10px"><input id="askq" type="text" placeholder="Ask anything about ${esc(p.name)}" aria-labelledby="askH" style="flex:1;min-width:0"><button class="act pri" id="askgo" style="padding:0 16px">Ask</button></div>
   <div class="ans" id="ans" aria-live="polite"${a?"":" hidden"}>${a?`<p class="ansq">${esc(a.q)}</p>${a.busy?`<p class="note">Thinking…</p>`:""}${md(a.text||"")}${a.err?`<p class="note">${esc(a.err)}</p>`:""}${a.busy?`<button class="tag" id="askstop">Stop</button>`:`<p class="note">Answered by Claude. Check timings and prices locally.</p>`}`:""}</div>`}
function bindAsk(p){if(!CAP.sample)return;const pid=id(p);const run=async q=>{if(!q)return;const prev=S.ans[pid];if(prev&&prev.busy)return;const a={q,text:"",busy:true,ctl:new AbortController()};S.ans[pid]=a;rer();
    try{await CAP.sample(`You are a knowledgeable, honest India travel guide. Answer the traveller's question about this place in under 140 words. Use short paragraphs or "- " bullet lines. Be specific and practical. Do not invent exact timings, ticket prices, phone numbers or bus numbers; if they matter, say to check locally. If you are unsure, say so.\n\n${placeCtx(p)}\n\nQuestion: ${q}`,{signal:a.ctl.signal,onText:({text})=>{a.text=text;const el=$("#ans");if(el&&S.sel&&id(S.sel)===pid){el.hidden=false;el.innerHTML=`<p class="ansq">${esc(q)}</p>${md(text)}<button class="tag" id="askstop">Stop</button>`;el.querySelector("#askstop").onclick=()=>a.ctl.abort()}}})}
    catch(e){if(e.text)a.text=e.text;if(e.code!=="cancelled")a.err=errMsg(e)}a.busy=false;rer()};
  const rer=()=>{if(S.sel&&id(S.sel)===pid){const el=$("#ans"),a=S.ans[pid];if(!el)return;el.hidden=false;el.innerHTML=`<p class="ansq">${esc(a.q)}</p>${a.busy?`<p class="note">Thinking…</p>`:""}${md(a.text||"")}${a.err?`<p class="note">${esc(a.err)}</p>`:""}${a.busy?`<button class="tag" id="askstop">Stop</button>`:`<p class="note">Answered by Claude. Check timings and prices locally.</p>`}`;const s=el.querySelector("#askstop");if(s)s.onclick=()=>a.ctl.abort()}};
  V.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>run(b.dataset.q));const go_=()=>{const v=$("#askq").value.trim();if(v){run(v);$("#askq").value=""}};$("#askgo").onclick=go_;$("#askq").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();go_()}};const s=$("#askstop");if(s)s.onclick=()=>S.ans[pid]?.ctl.abort()}
async function getStory(p){const pid=id(p);if(S.story[pid]?.text)return S.story[pid].text;const r=await CAP.sample(`Write a spoken audio-guide narration of about 110 words for a visitor arriving at the place below. Warm, vivid and accurate. Mention what makes it special and one thing to look out for. Do not invent dates, numbers or legends you are unsure of. Plain text only, no headings or lists.\n\n${placeCtx(p)}`,{cache:{gcTime:86400000}});S.story[pid]={text:r.text};return r.text}
function storyBlock(p){if(!CAP.sample)return"";const s=S.story[id(p)];return`<h3>Audio guide</h3><div class="acts" style="grid-template-columns:repeat(${CAP.tts?2:1},minmax(0,1fr))"><button class="act" id="stbtn">${s?.busy?"Writing the story…":s?.text?"Story shown below":"Read the story"}</button>${CAP.tts?`<button class="act" id="lsbtn" aria-pressed="false">▶ Listen</button>`:""}</div><div class="ans" id="story"${s?.text?"":" hidden"}>${s?.text?`<p>${esc(s.text)}</p><p class="note">Written by Claude for this atlas.</p>`:""}</div>`}
function bindStory(p){if(!CAP.sample)return;const pid=id(p);const show=t=>{const el=$("#story");if(el&&S.sel&&id(S.sel)===pid){el.hidden=false;el.innerHTML=`<p>${esc(t)}</p><p class="note">Written by Claude for this atlas.</p>`}};
  $("#stbtn").onclick=async()=>{const b=$("#stbtn");b.textContent="Writing the story…";b.disabled=true;try{show(await getStory(p))}catch(e){toast(errMsg(e))}b.disabled=false;b.textContent="Story shown below"};
  const lb=$("#lsbtn");if(lb&&CAP.tts){let speaking=false;const set=on=>{speaking=on;lb.textContent=on?"■ Stop":"▶ Listen";lb.setAttribute("aria-pressed",on)};

/* ================= Before you go: hours, entry, contact, from OpenStreetMap + Wikidata ================= */
const OHD=["Su","Mo","Tu","We","Th","Fr","Sa"];
/* a small opening_hours reader for the common forms; returns null when the rule is too unusual to trust */
function ohToday(oh,dt=new Date()){if(!oh)return null;oh=oh.trim();if(oh==="24/7")return{open:true,all:true};
  const wd=dt.getDay(),day=OHD[wd];let ivs=null,hit=false;
  for(let rule of oh.split(";")){rule=rule.trim();if(!rule)continue;
    let m=rule.match(/^((?:(?:Mo|Tu|We|Th|Fr|Sa|Su|PH)(?:-(?:Mo|Tu|We|Th|Fr|Sa|Su))?,?\s*)+)?\s*(.*)$/);if(!m)return null;
    const ds=(m[1]||"").trim(),ts=(m[2]||"").trim();let inc=!ds;
    if(ds)for(const part of ds.split(",").map(x=>x.trim()).filter(Boolean)){if(part==="PH")continue;const[a,b]=part.split("-");const ia=OHD.indexOf(a),ib=b?OHD.indexOf(b):ia;if(ia<0||ib<0)return null;
      for(let i=ia,n=0;n<8;i=(i+1)%7,n++){if(i===wd)inc=true;if(i===ib)break}}
    if(!inc)continue;hit=true;
    if(/^(off|closed)$/i.test(ts)){ivs=[];continue}
    if(/^sunrise-sunset$/i.test(ts)){ivs=[[6,18.5]];continue}
    const L=[];for(const t of ts.split(",")){const q=t.trim().match(/^(\d{1,2}):(\d{2})-(\d{1,2}):(\d{2})\+?$/);if(!q)return null;L.push([+q[1]+q[2]/60,+q[3]+q[4]/60])}
    if(!L.length)return null;ivs=L}
  if(!hit)return{open:false,closedToday:true};
  const h=dt.getHours()+dt.getMinutes()/60;if(!ivs||!ivs.length)return{open:false,closedToday:true};
  for(const[a,b]of ivs){const e=b<=a?b+24:b;if(h>=a&&h<e)return{open:true,until:b}}
  const nx=ivs.find(([a])=>a>h);return{open:false,opens:nx?nx[0]:null,later:!!nx}}
const clkH=h=>{let H=Math.floor(h)%24,m=Math.round((h-Math.floor(h))*60);if(m===60){H=(H+1)%24;m=0}const ap=H<12?"am":"pm",h12=H%12||12;return`${h12}${m?":"+String(m).padStart(2,"0"):""} ${ap}`};
async function osmTags(p){const key="ita-osm:"+id(p);try{const c=JSON.parse(sessionStorage.getItem(key)||"null");if(c)return c.t}catch(e){}
  const loc=new Set([...canon(p.district).split(" "),...canon(stOf(p.slug).name).split(" ")]),GEN=/^(the|of|and|sri|shri|temple|fort|lake|falls|beach|hill|hills|park|national|palace|church|mosque|garden|museum|cave|caves|dam|river|island|market|road|point|view|viewpoint|wildlife|sanctuary|bird)$/;
  const words=canon(p.name).split(" ").filter(w=>w.length>=4&&!loc.has(w)&&!GEN.test(w)).sort((a,b)=>b.length-a.length);
  /* no distinctive word (e.g. "Mysuru Palace" in Mysuru): fall back to the longest word, searched closer in */
  const w0=words[0]||canon(p.name).split(" ").filter(w=>w.length>=4&&!/^(the|and|sri|shri)$/.test(w)).sort((a,b)=>b.length-a.length)[0];

    try{const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),9000);const j=await fetch(u,{method:"POST",body:"data="+encodeURIComponent(q),headers:{"Content-Type":"application/x-www-form-urlencoded"},signal:ctl.signal}).then(r=>{if(!r.ok)throw 0;return r.json()});clearTimeout(t);
      const E=(j.elements||[]).filter(e=>e.tags&&e.tags.name).sort((a,b)=>Object.keys(b.tags).length-Object.keys(a.tags).length),best=E[0]?{...E[0].tags,_id:E[0].type+"/"+E[0].id}:null;
      try{sessionStorage.setItem(key,JSON.stringify({t:best}))}catch(e){}return best}catch(e){}}
  return null}

/* ================= Offline packs: photos and facts for a whole state, saved on the phone ================= */
function packUrls(slug){const L=(S.data[slug]||{}).places||[],u=[];L.forEach(p=>{const ph=photoOf(id(p));if(!ph)return;u.push(phSize(ph.t,500));if(p.tier!=="gem")u.push(phSize(ph.t,960))});return u}

  const urls=packUrls(slug),files=[`data/facts/${slug}.json`,`data/places/${slug}.json`,`data/districts/${slug}.json`];let done=0,ok=0;const tot=urls.length+files.length;
  for(const f of files){try{const r=await fetch(f,{cache:"no-cache"});if(r.ok)ok++}catch(e){}done++;prog&&prog(done,tot)}
  let i=0;const worker=async()=>{while(i<urls.length){const u=urls[i++];try{await fetch(u,{mode:"no-cors"});ok++}catch(e){}done++;prog&&prog(done,tot)}};
  await Promise.all([worker(),worker(),worker(),worker()]);
  M.packs=M.packs||{};M.packs[slug]={t:Date.now(),n:urls.length,ok};save();return{ok,tot}}

/* ================= Crowd calendar: the next six weeks, day by day ================= */
function dayKind(p,d){const k=ymd(d),w=d.getDay(),m=d.getMonth()+1,pop=p.tier!=="gem",inS=inSeason(m,p),C=cond(p,m);
  let hol=null;try{hol=(holCfg().on||[]).includes(k)?(HOL.find(h=>h[0]===k)||[])[1]:null}catch(e){}
  let lw=false;try{lw=(S._lwk||(S._lwk=breaks(0))).some(b=>d>=b.s&&d<=b.e)}catch(e){}
  const fs=(S.data[p.slug].festivals||[]).find(x=>x.n===p.n&&inR(m,x.months[0],x.months[1]));
  if(C.some(c=>c[0]==="snow"&&/closed|cut off/.test(c[1])))return["no","Likely closed or cut off"];
  if(!inS)return["off",C.find(c=>["rain","hot","snow","cold"].includes(c[0]))?.[1]||"Off season"];
  if(hol||lw)return["rush",hol?`${hol}: expect crowds`:"Long weekend: expect crowds"];
  if(w===0||w===6)return[pop?"busy":"ok",pop?"Weekend: busier":"Weekend"];
  return["good",fs&&p.tier!=="gem"?`Weekday · ${fs.name} season`:"Weekday: quieter"]}
function crowdBlock(p){return`<details class="pcard crc" id="crc"><summary><b>Crowd calendar</b><span class="m2">Next six weeks</span></summary><div id="crcb"></div></details>`}
function fillCrowd(p){const det=$("#crc");if(!det)return;const draw=()=>{if($("#crcb").childElementCount)return;const t0=dOf(today()),start=addD(t0,-((t0.getDay()+6)%7)),cells=[],best=[];
    for(let i=0;i<42;i++){const d=addD(start,i),past=d<t0,[k,why]=past?["past",""]:dayKind(p,d);cells.push(`<span class="crd cr-${k}" title="${esc(fmtD(d)+(why?": "+why:""))}"${past?' aria-hidden="true"':""}><b>${d.getDate()}</b>${d.getDate()===1||i===0?`<i>${MON[d.getMonth()]}</i>`:""}<span class="sr">${esc(fmtD(d,{weekday:"long",day:"numeric",month:"long"}))}: ${esc(why)}</span></span>`);if(!past&&k==="good")best.push(d)}
    const run=(()=>{let b=null,cur=[];best.forEach(d=>{if(cur.length&&(d-cur[cur.length-1])/864e5===1)cur.push(d);else cur=[d];if(!b||cur.length>b.length)b=[...cur]});return b})();
    $("#crcb").innerHTML=`<div class="crh" aria-hidden="true">${["M","T","W","T","F","S","S"].map(x=>`<span>${x}</span>`).join("")}</div><div class="crg">${cells.join("")}</div>
     <div class="crl"><span><i class="cr-good"></i>Quiet</span><span><i class="cr-busy"></i>Weekend</span><span><i class="cr-rush"></i>Holiday rush</span><span><i class="cr-off"></i>Off season</span></div>
     ${run&&run.length?`<p class="cnow" style="margin:8px 0 0"><b>Best stretch:</b> ${fmtD(run[0],{weekday:"short",day:"numeric",month:"short"})}${run.length>1?` – ${fmtD(run[run.length-1],{weekday:"short",day:"numeric",month:"short"})}`:""}</p>`:`<p class="cnow" style="margin:8px 0 0">No quiet in-season days in the next six weeks.</p>`}
     <p class="note" style="margin:4px 0 0">From the season, weekends and the holiday list in Settings. Not live crowd data.</p>`};

function permitsOf(p,trek=true){const out=[];const nm=p.name+" "+(p.district||"");
 for(const r of PERMITS){if(r.s!==p.slug)continue;if(r.r&&!r.r.test(r.r.source.startsWith("^")?p.name:nm))continue;out.push(r)}
 const t=p.trek;if(trek&&t&&typeof t==="object"&&t.permit)out.push({t:"Trek permit",w:"Trekkers",h:t.permit});return out}
function permitBlock(p){const L=permitsOf(p,false);if(!L.length)return"";
 return`<div class="pcard xcd pmt"><div class="tkh"><h3 style="margin:0">Permits</h3><span class="tkk">Plan ahead</span></div>
 ${L.map(r=>`<div class="pmr"><b>${esc(r.t)}</b><span class="pmw">${esc(r.w)}</span><p>${esc(r.h)}</p>${r.f?`<p class="note" style="margin:2px 0 0">${esc(r.f)}</p>`:""}</div>`).join("")}
 <p class="note" style="margin:6px 0 0">Rules change; check the official portal before you travel.</p></div>`}
function permitList(ps){const seen=new Map();
 for(const p of ps)for(const r of permitsOf(p)){const k=r.t+"|"+(r.r?r.r.source:r.s)+"|"+r.h;if(!seen.has(k))seen.set(k,{r,ps:[]});seen.get(k).ps.push(p)}
 if(!seen.size)return"";
 return`<div class="pcard pmt" style="margin-top:12px"><h3 style="margin:0 0 6px">Permits for this trip</h3><ul class="pml">${[...seen.values()].map(({r,ps})=>`<li><label><input type="checkbox" data-pmk="${esc(r.t+ps[0].name)}"${(M.pmDone||{})[r.t+ps[0].name]?" checked":""}> <b>${esc(r.t)}</b> <span class="pmw">${esc(r.w)}</span></label><p>${esc(r.h)}</p><p class="note" style="margin:0">For ${ps.slice(0,4).map(q=>esc(q.name)).join(", ")}${ps.length>4?` and ${ps.length-4} more`:""}</p></li>`).join("")}</ul></div>`}
function bindPermits(){V.querySelectorAll("[data-pmk]").forEach(c=>c.onchange=()=>{M.pmDone=M.pmDone||{};if(c.checked)M.pmDone[c.dataset.pmk]=1;else delete M.pmDone[c.dataset.pmk];save()})}

 const m1=NOWM,m2=NOWM%12+1,ok=new Set(S.states.map(x=>x.slug)),L=(S.fx||[]).filter(f=>ok.has(f.state)&&(f.months.includes(m1)||f.months.includes(m2)));
 const g=gFx.selectAll("g").data(L).join("g").attr("class","fxp").attr("transform",f=>{const[x,y]=P(f.lng,f.lat);return`translate(${x},${y})`})
  .attr("role","button").attr("tabindex",0).attr("aria-label",f=>`Festival: ${f.name}`);
 g.append("rect").attr("x",-4).attr("y",-4).attr("width",8).attr("height",8).attr("transform","rotate(45)");
 g.on("click",(e,f)=>{e.stopPropagation();const a=f.months[0],b=f.months[f.months.length-1];toast(`${f.name} · usually ${a===b?MONL[a-1]:MONL[a-1]+"–"+MONL[b-1]} — ${f.why}`)})
  .on("keydown",(e,f)=>{if(e.key==="Enter")e.currentTarget.dispatchEvent(new MouseEvent("click"))});
 sizeFx()}

function route(silent,h0){const h=h0!=null?h0:location.hash.slice(1);const m=h.match(/^(.*)-(\d+)$/);
  if(m&&S.data[m[1]]){const p=S.data[m[1]].places.find(x=>x.n==m[2]);if(p){S.slug=m[1];classStates();S.stack=[{v:"explore"}];openPlace(p,!silent);return}}
  paint()}
(async()=>{
  try{
    const[topo,states,fx]=await Promise.all([fetch("data/india-states.json").then(r=>r.json()),fetch("data/states.json").then(r=>r.json()),fetch("data/festivals.json").then(r=>r.json()).catch(()=>[])]);S.fx=fx;
    S.topo=topo;S.feats=topojson.feature(topo,topo.objects.states).features;S.ALL=states;S.cc="w";try{const c=localStorage.getItem("ita-cc");if(CC[c])S.cc=c}catch(e){}{const h=decodeURIComponent(location.hash.slice(1));const m=states.find(x=>h===x.slug||h.startsWith(x.slug+"-"));if(m&&(m.cc||"in")!==S.cc&&!(S.cc==="w"&&false))S.cc=m.cc||"in"}S.states=ccStates();

    try{const [hist,registry]=await Promise.all([fetch("data/historical/index.json").then(r=>r.json()),fetch("data/entities/current.json").then(r=>r.json())]);S.historical=hist.places||[];S.entities=registry.entities||[]}catch(e){console.warn("Atlas layers unavailable",e)}
    try{if(sessionStorage.getItem("ita-refreshed")){sessionStorage.removeItem("ita-refreshed");setTimeout(()=>toast(`Atlas refreshed · ${allPlaces().length.toLocaleString("en-IN")} places`),400)}}catch(e){}
    fit();drawBase();
    Promise.all([fetch("data/rivers.json").then(r=>r.json()),fetch("data/terrain.json").then(r=>r.json())]).then(([r,t])=>{S.riv=r;S.ter=t;drawGeo();queueLabels()}).catch(()=>{});
    const h=location.hash.slice(1),m=h.match(/^(.*?)(?:-(\d+))?$/);
    const first=h?states.find(s=>s.status==="done"&&(h===s.slug||h.startsWith(s.slug+"-"))):null;
    if(h.startsWith("go=")){S.slug=null;S.stack=[{v:"explore"},{v:"vote",a:h.slice(3)}];classStates();paint(true);drawPins();drawHome();setTimeout(fitIndia,250);if(mobile())setTimeout(()=>snapTo(2),300)}
    else if(h.startsWith("votes=")){S.slug=null;S.stack=[{v:"explore"}];classStates();paint();drawPins();drawHome();setTimeout(fitIndia,250);takeVotes(h.slice(6));if(mobile())setTimeout(()=>snapTo(2),300)}
    else if(h.startsWith("list=")){S.slug=null;S.stack=[{v:"explore"},{v:"slist",a:h.slice(5)}];classStates();paint(true);drawPins();drawHome();setTimeout(fitIndia,250);if(mobile())setTimeout(()=>snapTo(2),300)}
    else if(first){await openState(first.slug,false);if(h!==first.slug&&h.startsWith(first.slug+"-"))route(false,h);else setTimeout(()=>focusState(1000),250)}
    else{S.slug=null;S.stack=[{v:"explore"}];classStates();paint();drawPins();drawHome();setTimeout(fitIndia,250)}
    if(!M.onboarded)setTimeout(()=>{if(!M.onboarded)showOnboard(false)},900);
    requestAnimationFrame(()=>setTimeout(()=>phGo&&phGo(),50));
    {const L=allPlaces();let i=0;const idle=window.requestIdleCallback||(f=>setTimeout(()=>f({timeRemaining:()=>8}),60));const step=dl=>{const t0=performance.now();while(i<L.length&&(dl.timeRemaining()>2||performance.now()-t0<6)){hay(L[i]);L[i]._cn||(L[i]._cn=" "+canon(L[i].name)+" ");i++}if(i<L.length)idle(step)};setTimeout(()=>idle(step),2500)}
  }catch(e){phGo&&phGo();V.innerHTML=`<div class="empty">Couldn't load the atlas. Reload to try again.</div>`;console.error(e)}
  addEventListener("hashchange",()=>{const h=location.hash.slice(1);/* links from friends are never set by the app itself */if(h.startsWith("go=")){remember();S.stack.push({v:"vote",a:h.slice(3)});paint(true);if(mobile())snapTo(2);return}if(h.startsWith("votes=")){takeVotes(h.slice(6));return}if(Date.now()-ignHashT<600)return;if(h.startsWith("list=")){remember();S.stack.push({v:"slist",a:h.slice(5)});paint(true);if(mobile())snapTo(2);return}const s=S.states.find(x=>x.slug===h);if(s&&s.status==="done"&&h!==S.slug)openState(s.slug,true);else if(/-\d+$/.test(h)&&!(S.sel&&h===S.sel.slug+"-"+S.sel.n))route(false)});
})();
