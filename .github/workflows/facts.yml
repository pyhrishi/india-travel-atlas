name: Verify places (Wikipedia + Wikidata) — recoverable parallel regions
on:
  workflow_dispatch:
    inputs:
      force:
        description: Re-check every place in every region
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'data/places/**'
      - '.github/scripts/facts.py'
      - '.github/scripts/merge_facts.py'
      - '.github/scripts/photos_verified.py'
      - '.github/workflows/facts.yml'
  schedule:
    - cron: '41 20 * * 3'
permissions:
  contents: write
  actions: read
concurrency:
  group: facts-parallel
  cancel-in-progress: false
jobs:
  verify:
    name: Verify ${{ matrix.state }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        state:
          - andhra-pradesh
          - arunachal-pradesh
          - assam
          - bihar
          - chhattisgarh
          - goa
          - gujarat
          - haryana
          - himachal-pradesh
          - jharkhand
          - karnataka
          - kerala
          - madhya-pradesh
          - maharashtra
          - manipur
          - meghalaya
          - mizoram
          - nagaland
          - odisha
          - punjab
          - rajasthan
          - sikkim
          - tamil-nadu
          - telangana
          - tripura
          - uttar-pradesh
          - uttarakhand
          - west-bengal
          - andaman-and-nicobar-islands
          - chandigarh
          - dadra-and-nagar-haveli-and-daman-and-diu
          - delhi
          - jammu-and-kashmir
          - ladakh
          - lakshadweep
          - puducherry
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate Python verifier and merge scripts
        run: python3 -m py_compile .github/scripts/facts.py .github/scripts/merge_facts.py
      - name: Restore checkpoint from an earlier attempt of this run
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: region-${{ matrix.state }}
          path: recovery
      - name: Resume from recovered checkpoint when available
        shell: bash
        run: |
          if [ -f "recovery/.github/facts-state/${{ matrix.state }}.json" ]; then
            mkdir -p .github/facts-state data/facts
            cp "recovery/.github/facts-state/${{ matrix.state }}.json" ".github/facts-state/${{ matrix.state }}.json"
            echo "Restored region checkpoint from an earlier attempt."
          fi
          if [ -f "recovery/data/facts/${{ matrix.state }}.json" ]; then
            mkdir -p data/facts
            cp "recovery/data/facts/${{ matrix.state }}.json" "data/facts/${{ matrix.state }}.json"
          fi
      - name: Verify region with checkpoint-aware retries
        env:
          FACTS_STATE: ${{ matrix.state }}
          FORCE: ${{ github.event.inputs.force }}
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "::group::${{ matrix.state }} attempt ${attempt}/3"
            ARGS=""
            if [ "$FORCE" = "true" ] && [ "$attempt" -eq 1 ]; then ARGS="--force"; fi
            python3 .github/scripts/facts.py $ARGS
            result=$?
            echo "::endgroup::"
            if [ "$result" -eq 0 ]; then
              echo "Region verification completed."
              exit 0
            fi
            echo "Attempt $attempt failed with exit code $result; the next attempt will resume from the saved checkpoint."
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          echo "::error::Region ${{ matrix.state }} failed after 3 checkpoint-aware attempts."
          exit "$result"
      - name: Upload latest region result and checkpoint, even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: region-${{ matrix.state }}
          path: |
            data/facts/${{ matrix.state }}.json
            .github/facts-state/${{ matrix.state }}.json
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true
          overwrite: true

  publish:
    name: Validate, merge and publish complete catalogue only
    needs: verify
    if: ${{ needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download all region artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: region-*
          path: region-artifacts
          merge-multiple: false
      - name: Validate all 36 regions and merge atomically
        run: python3 .github/scripts/merge_facts.py region-artifacts
      - name: Verify Commons files and publish only verified article photos
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3; do
            python3 .github/scripts/photos_verified.py
            result=$?
            if [ "$result" -eq 0 ]; then exit 0; fi
            echo "Photo verification attempt $attempt failed (exit $result)."
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          echo "::error::Photo verification failed after 3 attempts; refusing to publish partial outputs."
          exit "$result"
      - name: Refresh offline cache version
        run: python3 tools/bump_sw.py
      - name: Commit merged results and checkpoints
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/facts data/photos.json data/photo-credits.json .github/facts-state sw.js
          git diff --cached --quiet && { echo "No change"; exit 0; }
          git commit -m "Merge complete parallel place verification results"
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin main || exit 1
            if git push origin HEAD:main; then exit 0; fi
            echo "Push attempt $attempt failed; retrying."
            sleep 15
          done
          exit 1

  report:
    name: Verification run summary
    needs: [verify, publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report run outcome
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          {
            echo "## Place verification pipeline"
            echo "- Region matrix: **$VERIFY_RESULT**"
            echo "- Validated merge and publish: **$PUBLISH_RESULT**"
            if [ "$VERIFY_RESULT" != "success" ]; then
              echo ""
              echo "Publishing was blocked. Inspect failed region jobs and their uploaded checkpoint artifacts, then rerun failed jobs."
            elif [ "$PUBLISH_RESULT" != "success" ]; then
              echo ""
              echo "All region jobs passed, but merge/photo/publish did not complete. No successful publish is claimed."
            else
              echo ""
              echo "All 36 region artifacts passed completeness checks before publishing."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
