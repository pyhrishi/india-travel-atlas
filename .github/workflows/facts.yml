name: Verify places (Wikipedia + Wikidata)
on:
  workflow_dispatch:
    inputs:
      force:
        description: Re-check every place
        type: boolean
        default: false
      debug:
        description: 'Only print matching details for these names (A|B|C); saves nothing'
        type: string
        default: ''
  push:
    branches: [main]
    paths: ['data/places/**', '.github/scripts/facts.py', '.github/workflows/facts.yml']
  schedule:
    - cron: '41 20 * * 3'
permissions:
  contents: write
concurrency:
  group: facts
  cancel-in-progress: false
jobs:
  facts:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Match every place to its own article
        timeout-minutes: 210
        continue-on-error: true
        env:
          FACTS_DEBUG: ${{ inputs.debug }}
        run: python3 .github/scripts/facts.py ${{ inputs.force && '--force' || (github.event_name == 'push' && '--force' || '') }}
      - name: Verify Commons files and publish only verified article photos
        if: always() && inputs.debug == ''
        continue-on-error: true
        run: python3 .github/scripts/photos_verified.py
      - name: Save results (also after a timeout, so the next run resumes)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/facts data/photos.json data/photo-credits.json .github/facts-state.json 2>/dev/null || git add .github/facts-state.json
          git diff --cached --quiet && { echo "No change"; exit 0; }
          git commit -m "Update place facts"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 10; done
