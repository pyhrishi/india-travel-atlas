name: Build global administrative maps

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/global-maps.yml"
      - "tools/build_global_maps.py"
      - "data/maps/index.json"
  pull_request:
    paths:
      - "tools/build_global_maps.py"
      - "tests/test_global_maps.py"
      - "index.html"
      - "sw.js"
      - ".github/workflows/global-maps.yml"
  workflow_dispatch:
    inputs:
      iso2:
        description: "Comma-separated ISO2 country codes (maximum 10)"
        required: true
        default: "ID,PH,TH,VN,MY"

permissions:
  contents: write

concurrency:
  group: global-map-build
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and run map pipeline tests
        run: |
          python -m py_compile tools/build_global_maps.py tools/check_app_js.py
          python tools/check_app_js.py
          python -m unittest discover -s tests -p "test_global_maps.py" -v

  build:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate requested batch
        env:
          ISO2: ${{ inputs.iso2 || 'ID,PH,TH,VN,MY' }}
        run: |
          python - <<'PY'
          import os, re, sys
          codes = [x.strip().upper() for x in os.environ["ISO2"].split(",") if x.strip()]
          if not codes or len(codes) > 10 or any(not re.fullmatch(r"[A-Z]{2}", x) for x in codes):
              sys.exit("Provide 1–10 comma-separated ISO2 codes")
          if len(set(codes)) != len(codes):
              sys.exit("Duplicate ISO2 codes are not allowed")
          print("Building:", ", ".join(codes))
          PY
      - name: Build and validate map files
        env:
          ISO2: ${{ inputs.iso2 || 'BD,BT,LK,MV,KH' }}
        run: python tools/build_global_maps.py --iso2 "$ISO2"
      - name: Refresh offline cache version
        run: python tools/bump_sw.py
      - name: Commit validated map batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/maps sw.js
          if git diff --cached --quiet; then
            echo "No map changes to commit."
          else
            git commit -m "Add validated global administrative map batch"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
