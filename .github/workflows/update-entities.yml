name: Refresh current geographical entities
on:
  push:
    branches: [main]
    paths:
      - 'tools/import_m49.py'
      - '.github/workflows/update-entities.yml'
  workflow_dispatch:
  schedule:
    - cron: "23 4 1 * *"
permissions:
  contents: write
concurrency:
  group: entities-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import UN M49 country and area list
        run: python3 tools/import_m49.py
      - name: Validate Atlas layer references
        run: python3 tools/validate_layers.py
      - name: Commit refreshed registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/entities/current.json
          if git diff --cached --quiet; then
            echo "Registry is already current."
          else
            git commit -m "Refresh UN M49 current geographical entities"
            git push origin HEAD:main
          fi
